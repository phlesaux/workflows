name: 🔐 Secret scan

on:
  pull_request:
  workflow_call:
    inputs:
      config-path:
        description: Path to a gitleaks config file (empty uses the default ruleset)
        type: string
        default: ""
      fetch-depth:
        description: Commits to fetch (0 fetches the full history)
        type: number
        default: 0

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Scan for secrets
        env:
          GITLEAKS_CONFIG: ${{ inputs.config-path }}
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          args=(git --redact --verbose --exit-code 1)
          if [ -n "$GITLEAKS_CONFIG" ]; then
            args+=(--config "$GITLEAKS_CONFIG")
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" "${args[@]}" .
